<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="squircleClip">
      <rect x="0" y="0" width="1024" height="1024" rx="230" ry="230"/>
    </clipPath>
    <radialGradient id="bgGradient" cx="38%" cy="30%" r="95%">
      <stop offset="0%" stop-color="#123259"/>
      <stop offset="55%" stop-color="#0B2140"/>
      <stop offset="100%" stop-color="#060F22"/>
    </radialGradient>
    <linearGradient id="waveGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5CE1FF"/>
      <stop offset="55%" stop-color="#38B6FF"/>
      <stop offset="100%" stop-color="#2E8CFF"/>
    </linearGradient>
    <filter id="softBlur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="softBlurSmall" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1024" height="1024" rx="230" ry="230" fill="url(#bgGradient)"/>

  <!-- Faint instrument-panel grid, clipped to the squircle -->
  <g clip-path="url(#squircleClip)" opacity="0.07" stroke="#8FD8FF" stroke-width="2">
    <line x1="0" y1="171" x2="1024" y2="171"/>
    <line x1="0" y1="341" x2="1024" y2="341"/>
    <line x1="0" y1="512" x2="1024" y2="512"/>
    <line x1="0" y1="683" x2="1024" y2="683"/>
    <line x1="0" y1="853" x2="1024" y2="853"/>
    <line x1="171" y1="0" x2="171" y2="1024"/>
    <line x1="341" y1="0" x2="341" y2="1024"/>
    <line x1="512" y1="0" x2="512" y2="1024"/>
    <line x1="683" y1="0" x2="683" y2="1024"/>
    <line x1="853" y1="0" x2="853" y2="1024"/>
  </g>

  <!-- subtle top-left panel sheen -->
  <ellipse cx="330" cy="230" rx="360" ry="220" fill="#FFFFFF" opacity="0.045"/>

  <!-- The signal path: smooth analog wave morphing into a sharp digital pulse -->
  <!-- glow layer -->
  <path d="M140,512
           C 185,395 235,395 280,512
           C 325,629 375,629 420,512
           C 445,460 460,430 500,430
           L 580,430
           L 580,594
           L 660,594
           L 660,430
           L 740,430
           L 740,512
           L 860,512"
        fill="none" stroke="#4CC9FF" stroke-width="58" stroke-linecap="round" stroke-linejoin="round"
        opacity="0.30" filter="url(#softBlur)"/>

  <!-- crisp layer -->
  <path d="M140,512
           C 185,395 235,395 280,512
           C 325,629 375,629 420,512
           C 445,460 460,430 500,430
           L 580,430
           L 580,594
           L 660,594
           L 660,430
           L 740,430
           L 740,512
           L 860,512"
        fill="none" stroke="url(#waveGradient)" stroke-width="32" stroke-linecap="round" stroke-linejoin="miter"/>

  <!-- signal terminal node (glow + crisp) -->
  <circle cx="860" cy="512" r="34" fill="#FFB648" opacity="0.35" filter="url(#softBlurSmall)"/>
  <circle cx="860" cy="512" r="17" fill="#FFC469"/>
</svg>
