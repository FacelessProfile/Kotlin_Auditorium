name: Mobile App CI/CD (Build & Deploy)

on:
  push:
    branches: [ "master", "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:
    inputs:
      deploy_to_prod:
        description: 'Выкатить на прод-сервер (deploy to prod)'
        type: boolean
        default: true
      release_notes:
        description: 'Описание релиза (Release notes)'
        type: string
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==================================================
  # ДЖОБА 1: СБОРКА И ТЕСТИРОВАНИЕ ANDROID APK
  # ==================================================
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest
    outputs:
      version_code: ${{ steps.version_info.outputs.VERSION_CODE }}
      version_name: ${{ steps.version_info.outputs.VERSION_NAME }}
      sha256: ${{ steps.version_info.outputs.SHA256 }}
      file_size: ${{ steps.version_info.outputs.FILE_SIZE }}
      release_notes: ${{ steps.version_info.outputs.RELEASE_NOTES }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Calculate Dynamic App Version
        id: calc_version
        run: |
          COMMIT_COUNT=$(git rev-list --count HEAD 2>/dev/null || echo 0)
          if [ -z "$COMMIT_COUNT" ] || [ "$COMMIT_COUNT" -le 0 ]; then
            COMMIT_COUNT=${{ github.run_number }}
          fi

          BASE_VERSION=$(grep -E '^\s*def\s+baseVersionName\s*=' app/build.gradle | cut -d'"' -f2)
          if [ -z "$BASE_VERSION" ]; then
            BASE_VERSION=$(grep -E '^\s*versionName\s*=' app/build.gradle | cut -d'"' -f2)
          fi
          if [ -z "$BASE_VERSION" ]; then
            BASE_VERSION="1.2"
          fi
          # Ensure base version is major.minor (e.g. 1.2)
          BASE_VERSION=$(echo "$BASE_VERSION" | awk -F. '{if (NF >= 2) print $1"."$2; else print $1".0"}')

          # Dynamic version increments with each commit
          APP_VERSION_NAME="${BASE_VERSION}.${COMMIT_COUNT}"
          APP_VERSION_CODE="${COMMIT_COUNT}"

          echo "VERSION_NAME=${APP_VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "VERSION_CODE=${APP_VERSION_CODE}" >> $GITHUB_OUTPUT

          echo "========================================"
          echo " Commit Count:    ${COMMIT_COUNT}"
          echo " Dynamic Version: ${APP_VERSION_NAME} (code: ${APP_VERSION_CODE})"
          echo "========================================"

      - name: Build Android APK
        run: ./gradlew assembleDebug -PappVersionCode=${{ steps.calc_version.outputs.VERSION_CODE }} -PappVersionName="${{ steps.calc_version.outputs.VERSION_NAME }}" --stacktrace

      - name: Extract Version Info & Compute Checksum
        id: version_info
        run: |
          VERSION_CODE="${{ steps.calc_version.outputs.VERSION_CODE }}"
          VERSION_NAME="${{ steps.calc_version.outputs.VERSION_NAME }}"

          if [ -z "$VERSION_CODE" ]; then
            VERSION_CODE=$(grep -E '^\s*versionCode\s*=' app/build.gradle | tr -dc '0-9')
          fi
          if [ -z "$VERSION_NAME" ]; then
            VERSION_NAME=$(grep -E '^\s*versionName\s*=' app/build.gradle | cut -d'"' -f2)
          fi
          if [ -z "$VERSION_CODE" ]; then VERSION_CODE="1"; fi
          if [ -z "$VERSION_NAME" ]; then VERSION_NAME="1.0"; fi

          APK_SOURCE="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_SOURCE" ]; then
            echo "Error: APK not found at $APK_SOURCE"
            exit 1
          fi

          mkdir -p release_package
          cp -f "$APK_SOURCE" release_package/app-release.apk

          FILE_SIZE=$(stat -c%s release_package/app-release.apk)
          SHA256=$(sha256sum release_package/app-release.apk | awk '{print $1}')

          RAW_NOTES="${{ github.event.inputs.release_notes }}"
          if [ -z "$RAW_NOTES" ]; then
            RAW_NOTES="${{ github.event.head_commit.message }}"
          fi
          if [ -z "$RAW_NOTES" ]; then
            RAW_NOTES="Обновление мобильного приложения v${VERSION_NAME} (сборка ${VERSION_CODE})"
          fi
          # Escape newlines and quotes for safe shell passing
          CLEAN_NOTES=$(echo "$RAW_NOTES" | tr '\n' ' ' | sed 's/"/\\"/g')

          echo "VERSION_CODE=${VERSION_CODE}" >> $GITHUB_OUTPUT
          echo "VERSION_NAME=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "FILE_SIZE=${FILE_SIZE}" >> $GITHUB_OUTPUT
          echo "SHA256=${SHA256}" >> $GITHUB_OUTPUT
          echo "RELEASE_NOTES=${CLEAN_NOTES}" >> $GITHUB_OUTPUT

          echo "========================================"
          echo " Version:       ${VERSION_NAME} (${VERSION_CODE})"
          echo " Size:          ${FILE_SIZE} bytes"
          echo " SHA-256:       ${SHA256}"
          echo " Release Notes: ${CLEAN_NOTES}"
          echo "========================================"

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-v${{ steps.version_info.outputs.VERSION_NAME }}-build${{ steps.version_info.outputs.VERSION_CODE }}
          path: release_package/app-release.apk
          retention-days: 14

  # ==================================================
  # ДЖОБА 2: ВЫКАТКА НА ПРОД-СЕРВЕР (SELF-UPDATE)
  # ==================================================
  deploy:
    name: Deploy APK to Production Server
    needs: build
    if: |
      (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) &&
      (github.event_name != 'workflow_dispatch' || github.event.inputs.deploy_to_prod == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Download Built APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: app-v${{ needs.build.outputs.version_name }}-build${{ needs.build.outputs.version_code }}
          path: deploy_artifacts

      - name: Validate Server Credentials
        run: |
          if [ -z "${{ secrets.SSH_HOST }}" ] || [ -z "${{ secrets.SSH_USER }}" ]; then
            echo "::error::Секреты SSH_HOST и SSH_USER не настроены в репозитории! Добавьте SSH_HOST, SSH_USER, SSH_PASSWORD (или SSH_KEY) в Settings -> Secrets and variables -> Actions"
            exit 1
          fi

      - name: Upload APK to Server via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "deploy_artifacts/app-release.apk"
          target: "/tmp"
          strip_components: 1
          overwrite: true

      - name: Update version.json and Publish on Server
        uses: appleboy/ssh-action@master
        env:
          VERSION_CODE: ${{ needs.build.outputs.version_code }}
          VERSION_NAME: ${{ needs.build.outputs.version_name }}
          RELEASE_NOTES: ${{ needs.build.outputs.release_notes }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          envs: VERSION_CODE,VERSION_NAME,RELEASE_NOTES
          script: |
            set -e
            cd /home/sibsutis-ms/ejournal
            SOURCE_APK="/tmp/app-release.apk"
            TARGET_APK="./downloads/app-release.apk"
            VERSION_FILE="./downloads/version.json"
            
            if [ -f "$SOURCE_APK" ]; then
              if [ -f "./scripts/publish_apk.sh" ]; then
                chmod +x ./scripts/publish_apk.sh
                ./scripts/publish_apk.sh "$SOURCE_APK" "$VERSION_CODE" "$VERSION_NAME" "$RELEASE_NOTES"
              else
                mkdir -p ./downloads
                cp -f "$SOURCE_APK" "$TARGET_APK"
                chmod 644 "$TARGET_APK"
                FILE_SIZE=$(stat -c%s "$TARGET_APK")
                SHA256_HASH=$(sha256sum "$TARGET_APK" | awk '{print $1}')
                cat <<EOF > "$VERSION_FILE"
            {
              "version_code": ${VERSION_CODE},
              "version_name": "${VERSION_NAME}",
              "download_url": "/downloads/app-release.apk",
              "file_size": ${FILE_SIZE},
              "sha256": "${SHA256_HASH}",
              "release_notes": "${RELEASE_NOTES}",
              "is_critical": false
            }
            EOF
                chmod 644 "$VERSION_FILE"
              fi
              rm -f "$SOURCE_APK"
              
              echo "=== Successfully published APK on production server! ==="
              cat "$VERSION_FILE"
            else
              echo "Error: $SOURCE_APK was not found after upload"
              exit 1
            fi

      - name: Verify Live Update Endpoint
        run: |
          echo "Waiting for live update endpoint verification..."
          sleep 2
          curl -sf -k https://lms.signal.qlabs.pro:9001/api/app/version || true
