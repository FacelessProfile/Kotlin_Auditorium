plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
    id 'kotlin-parcelize'
    id 'androidx.navigation.safeargs.kotlin'
    id 'org.jetbrains.kotlin.plugin.serialization' version("1.9.0")
    id 'com.google.gms.google-services'
}

def getGitCommitCount = { ->
    try {
        def stdout = new ByteArrayOutputStream()
        exec {
            commandLine 'git', 'rev-list', '--count', 'HEAD'
            standardOutput = stdout
        }
        return stdout.toString().trim().toInteger()
    } catch (Exception ignored) {
        return 0
    }
}

def baseVersionName = "1.3"
def gitCommitCount = getGitCommitCount()
def autoVersionCode = gitCommitCount > 0 ? gitCommitCount : 3
def autoVersionName = gitCommitCount > 0 ? "${baseVersionName}.${gitCommitCount}" : baseVersionName

android {
    namespace = 'com.example.kotlinroomdatabase'
    compileSdk 36

    defaultConfig {
        applicationId = "ru.sibsutis.ejournal"
        minSdk = 26
        targetSdk = 36
        versionCode = (project.findProperty("appVersionCode") ?: autoVersionCode) as Integer
        versionName = (project.findProperty("appVersionName") ?: autoVersionName) as String

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
        ndk {
            abiFilters 'arm64-v8a'
        }
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }

    signingConfigs {
        debug {
            storeFile file("keystore/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
        release {
            def releaseKeystorePath = System.getenv("RELEASE_KEYSTORE_PATH") ?: "keystore/release.keystore"
            def releaseKeystoreFile = file(releaseKeystorePath)
            if (releaseKeystoreFile.exists()) {
                def getLocalProp = { String key ->
                    try {
                        def propFile = rootProject.file("local.properties")
                        if (propFile.exists()) {
                            def p = new Properties()
                            p.load(propFile.newDataInputStream())
                            return p.getProperty(key)
                        }
                    } catch (Exception ignored) {}
                    return null
                }
                storeFile releaseKeystoreFile
                storePassword System.getenv("RELEASE_KEYSTORE_PASSWORD") ?: (project.findProperty("RELEASE_KEYSTORE_PASSWORD") ?: getLocalProp("RELEASE_KEYSTORE_PASSWORD") ?: "")
                keyAlias System.getenv("RELEASE_KEY_ALIAS") ?: (project.findProperty("RELEASE_KEY_ALIAS") ?: "sibsutis_release")
                keyPassword System.getenv("RELEASE_KEY_PASSWORD") ?: (project.findProperty("RELEASE_KEY_PASSWORD") ?: getLocalProp("RELEASE_KEY_PASSWORD") ?: "")
                v1SigningEnabled true
                v2SigningEnabled true
                enableV3Signing true
            } else {
                // Security AUD-03: NEVER fall back to signing release builds with the public debug.keystore from git!
                def isReleaseTask = gradle.startParameter.taskNames.any { it.toLowerCase().contains("release") }
                if (isReleaseTask) {
                    throw new GradleException("Security AUD-03: Release keystore not found at '${releaseKeystoreFile.path}'. Release builds MUST NOT be signed with the public debug key.")
                }
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            debuggable true
        }
        release {
            signingConfig signingConfigs.release
            debuggable false
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}
dependencies {
    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.fragment:fragment-ktx:1.8.9'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'

    // Navigation Component
    implementation 'androidx.navigation:navigation-fragment-ktx:2.9.6'
    implementation 'androidx.navigation:navigation-ui-ktx:2.9.6'

    // Room components
    implementation "androidx.room:room-runtime:2.8.4"
    kapt "androidx.room:room-compiler:2.8.4"
    implementation "androidx.room:room-ktx:2.8.4"
    androidTestImplementation "androidx.room:room-testing:2.8.4"

    // Lifecycle components
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.10.0"
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:2.10.0"
    implementation "androidx.lifecycle:lifecycle-common-java8:2.10.0"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.10.0"

    // Kotlin components
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.10.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'

    // Serialization
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.9.0"
    // Sockets
    implementation 'org.zeromq:jeromq:0.6.0'
    // HTTP (due to the go backend)
    implementation 'com.squareup.okhttp3:okhttp:5.3.2'
    implementation 'com.squareup.okhttp3:logging-interceptor:5.3.2'
    // QR & Camera
    implementation("com.google.zxing:core:3.5.4")
    implementation("androidx.camera:camera-core:1.4.1")
    implementation("androidx.camera:camera-camera2:1.4.1")
    implementation("androidx.camera:camera-lifecycle:1.4.1")
    implementation("androidx.camera:camera-view:1.4.1")
    implementation("com.google.mlkit:barcode-scanning:17.3.0")
    // Google Play Services for Location
    implementation("com.google.android.gms:play-services-location:21.3.0")
    
    // Security Crypto & Biometrics
    implementation("androidx.security:security-crypto:1.1.0-alpha06")
    implementation("androidx.biometric:biometric-ktx:1.4.0-alpha02")
    // Commons Codec for Base32
    implementation("commons-codec:commons-codec:1.16.1")

    // Charts
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'

    // Firebase Cloud Messaging
    implementation platform('com.google.firebase:firebase-bom:33.9.0')
    implementation 'com.google.firebase:firebase-messaging'
}
